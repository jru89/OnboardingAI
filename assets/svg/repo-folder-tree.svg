<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-labelledby="rft-title rft-desc">
  <title id="rft-title">A typical repo folder tree</title>
  <desc id="rft-desc">An indented folder tree for my-project, showing README.md, src/, docs/, and .gitignore, each labeled with what it's for.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .tree-line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .name { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .desc { font-size: 11px; fill: #475569; }
    .folder-body { fill: #fde68a; stroke: #b45309; stroke-width: 1.5; }
    .folder-tab { fill: #fde68a; stroke: #b45309; stroke-width: 1.5; }
    .file-body { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.5; }
    .file-fold { fill: #cbd5e1; stroke: #64748b; stroke-width: 1.5; stroke-linejoin: round; }
  </style>

  <rect x="0" y="0" width="480" height="380" fill="#f8fafc" />

  <!-- ============ Root folder: my-project/ ============ -->
  <rect class="folder-tab" x="14" y="14" width="14" height="5" rx="1.5" />
  <rect class="folder-body" x="14" y="17" width="30" height="21" rx="2" />
  <text x="56" y="32" class="name" font-size="17">my-project/</text>

  <!-- trunk line connecting root to its four children -->
  <path class="tree-line" d="M 28 38 L 28 335" />

  <!-- ============ Child 1: README.md (file) ============ -->
  <path class="tree-line" d="M 28 80 L 60 80" />
  <rect class="file-body" x="60" y="68" width="18" height="24" rx="2" />
  <path class="file-fold" d="M 70 68 L 78 68 L 78 76 Z" />
  <text x="92" y="85" class="name">README.md</text>
  <text x="92" y="101" class="desc">Explains what the project is and how to use it</text>

  <!-- ============ Child 2: src/ (folder) ============ -->
  <path class="tree-line" d="M 28 165 L 60 165" />
  <rect class="folder-tab" x="60" y="152" width="14" height="5" rx="1.5" />
  <rect class="folder-body" x="60" y="155" width="26" height="19" rx="2" />
  <text x="92" y="170" class="name">src/</text>
  <text x="92" y="186" class="desc">Where the project's actual source code lives</text>

  <!-- ============ Child 3: docs/ (folder) ============ -->
  <path class="tree-line" d="M 28 250 L 60 250" />
  <rect class="folder-tab" x="60" y="237" width="14" height="5" rx="1.5" />
  <rect class="folder-body" x="60" y="240" width="26" height="19" rx="2" />
  <text x="92" y="255" class="name">docs/</text>
  <text x="92" y="271" class="desc">Written guides and reference material about the project</text>

  <!-- ============ Child 4: .gitignore (file) ============ -->
  <path class="tree-line" d="M 28 335 L 60 335" />
  <rect class="file-body" x="60" y="323" width="18" height="24" rx="2" />
  <path class="file-fold" d="M 70 323 L 78 323 L 78 331 Z" />
  <text x="92" y="340" class="name">.gitignore</text>
  <text x="92" y="356" class="desc">A list of files and folders that should NOT be</text>
  <text x="92" y="368" class="desc">tracked or shared</text>
</svg>
