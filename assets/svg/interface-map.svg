<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-labelledby="ifm-title ifm-desc">
  <title id="ifm-title">A simplified map of the Claude Code interface</title>
  <desc id="ifm-desc">A mock terminal window with three labeled callouts: where your project shows up, where you type, and an example permission prompt.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .callout-line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .callout-head { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .callout-sub { font-size: 10px; fill: #475569; }
    .badge-num { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="480" height="380" fill="#f8fafc" />

  <!-- ============ Terminal / chat window mock-up ============ -->
  <rect x="175" y="16" width="250" height="210" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
  <rect x="175" y="16" width="250" height="28" rx="8" fill="#0f172a" />
  <circle cx="191" cy="30" r="4" fill="#94a3b8" />
  <circle cx="203" cy="30" r="4" fill="#94a3b8" />
  <circle cx="215" cy="30" r="4" fill="#94a3b8" />
  <text x="230" y="34" font-size="12" fill="#ffffff">my-project</text>

  <!-- decorative lines standing in for conversation text -->
  <rect x="188" y="60" width="200" height="7" rx="3.5" fill="#cbd5e1" />
  <rect x="188" y="78" width="170" height="7" rx="3.5" fill="#cbd5e1" />
  <rect x="188" y="96" width="210" height="7" rx="3.5" fill="#cbd5e1" />
  <rect x="188" y="114" width="150" height="7" rx="3.5" fill="#cbd5e1" />
  <rect x="188" y="132" width="190" height="7" rx="3.5" fill="#cbd5e1" />

  <!-- input box -->
  <rect x="188" y="166" width="224" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
  <text x="200" y="191" font-size="16" font-weight="700" fill="#2563eb">&gt;</text>
  <text x="220" y="190" font-size="11" fill="#94a3b8" font-style="italic">Type your message here&#8230;</text>

  <!-- ============ Permission prompt example ============ -->
  <rect x="165" y="250" width="260" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
  <text x="183" y="274" font-size="14" font-weight="700" fill="#92400e">Permission needed</text>
  <text x="183" y="293" font-size="11" fill="#78350f">Claude Code wants to edit</text>
  <text x="183" y="307" font-size="11" fill="#78350f">greeting.txt</text>

  <rect x="183" y="318" width="80" height="26" rx="5" fill="#16a34a" />
  <text x="223" y="331" dy=".35em" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Yes, allow</text>
  <rect x="271" y="318" width="60" height="26" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <text x="301" y="331" dy=".35em" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">No</text>

  <!-- ============ Callout 1: project / file context ============ -->
  <path class="callout-line" d="M 130 30 L 175 30" />
  <circle cx="20" cy="30" r="10" fill="#2563eb" />
  <text x="20" y="30" dy=".35em" class="badge-num">1</text>
  <text x="38" y="23" class="callout-head">Project / file</text>
  <text x="38" y="38" class="callout-head">context</text>
  <text x="38" y="52" class="callout-sub">Which project is open</text>

  <!-- ============ Callout 2: where you type ============ -->
  <path class="callout-line" d="M 130 186 L 188 186" />
  <circle cx="20" cy="186" r="10" fill="#2563eb" />
  <text x="20" y="186" dy=".35em" class="badge-num">2</text>
  <text x="38" y="183" class="callout-head">Where you type</text>
  <text x="38" y="198" class="callout-sub">Plain English, like</text>
  <text x="38" y="210" class="callout-sub">texting a friend</text>

  <!-- ============ Callout 3: permission prompt ============ -->
  <path class="callout-line" d="M 130 305 L 165 305" />
  <circle cx="20" cy="305" r="10" fill="#2563eb" />
  <text x="20" y="305" dy=".35em" class="badge-num">3</text>
  <text x="38" y="297" class="callout-head">Permission</text>
  <text x="38" y="312" class="callout-head">prompt</text>
  <text x="38" y="326" class="callout-sub">Asks before Claude Code</text>
  <text x="38" y="338" class="callout-sub">changes anything</text>
</svg>
